[package]
name = "edgepool-vault"
version = "0.1.0"
description = "Edgepool vault program — SOL custody + vSHARE accounting (devnet-first, mainnet gated)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "edgepool_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1", features = ["token", "associated_token"] }

[dev-dependencies]
litesvm = "0.7.1"
solana-keypair = "2"
solana-pubkey = "2"
solana-signer = "2"
solana-transaction = "2"
solana-instruction = "2"
solana-transaction-error = "2"
