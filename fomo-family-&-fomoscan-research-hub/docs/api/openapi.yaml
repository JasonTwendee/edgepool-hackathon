openapi: 3.0.3
info:
  title: FOMO Wallet Tracker OnChain Engine API
  version: 1.0.0
  description: >
    Canonical REST + SSE contract. BE DTOs (`backend/src/modules/*/dto/*.dto.ts`)
    and the FE client (`frontend/lib/api.ts`) must match this file.
servers:
  - url: http://localhost:3000
    description: Local dev (legacy compat + NestJS-spec BE)
paths:
  /api/health:
    get:
      summary: Health + RPC info
      operationId: getHealth
      responses:
        '200':
          description: ONLINE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/wallets:
    get:
      summary: List tracked wallets
      operationId: listWallets
      responses:
        '200':
          description: Wallets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletListResponse'
  /api/wallets/rotation/status:
    get:
      summary: Rotation config + tracked counts (topN/cap/period)
      operationId: getRotationStatus
      responses:
        '200':
          description: Rotation status
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    required: [period, topN, cap, total, active]
                    properties:
                      period: { type: string }
                      topN: { type: integer }
                      cap: { type: integer }
                      total: { type: integer }
                      active: { type: integer }
  /api/wallets/rotation/tick:
    post:
      summary: Rotate tracked wallets from the verified leaderboard (ADMIN, audited)
      operationId: runRotationTick
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Rotation summary
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    required: [period, topN, cap, added, reactivated, deactivated, pruned, total, active]
                    properties:
                      period: { type: string }
                      topN: { type: integer }
                      cap: { type: integer }
                      added: { type: integer }
                      reactivated: { type: integer }
                      deactivated: { type: integer }
                      pruned: { type: integer }
                      total: { type: integer }
                      active: { type: integer }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
  /api/vaults/pools:
    get:
      summary: Pools index (pool app P1) with NAV, PnL, slots, basket
      operationId: listPools
      responses:
        '200':
          description: Pools
          content:
            application/json:
              schema:
                type: object
                required: [success, total, data]
                properties:
                  success: { type: boolean }
                  total: { type: integer }
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, name, kind, status, listing, navSol, navPerShare, slots, traders, pnl]
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        kind: { type: string, enum: [basket, partner] }
                        status: { type: string, enum: [live, paused] }
                        listing: { type: string, enum: [public, unlisted] }
                        navSol: { type: number }
                        navPerShare: { type: number }
                        hwmNavPerShare: { type: number }
                        totalShares: { type: number }
                        slots: { type: object, properties: { used: { type: integer }, max: { type: integer } } }
                        maxTraders: { type: integer }
                        traders:
                          type: array
                          items:
                            type: object
                            properties:
                              wallet: { type: string }
                              handle: { type: string }
                              rank: { type: integer, nullable: true }
                        pnl:
                          type: object
                          properties:
                            day: { type: object, properties: { sol: { type: number }, pct: { type: number } } }
                            week: { type: object, properties: { sol: { type: number }, pct: { type: number } } }
                            month: { type: object, properties: { sol: { type: number }, pct: { type: number } } }
                            all: { type: object, properties: { sol: { type: number }, pct: { type: number } } }
  /api/vaults/portfolio:
    get:
      summary: Portfolio overview for the session identity (P3)
      operationId: getPortfolioOverview
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Totals, pools, exposures, pending, history
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean }
                  data: { type: object }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
  /api/vaults/withdraw/{id}:
    delete:
      summary: Cancel an own QUEUED withdrawal (P3)
      operationId: cancelWithdrawal
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      id: { type: integer }
                      status: { type: string }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
  /api/wallets/{address}/enrich:
    post:
      summary: Backfill verified identity (avatar/bio/EVM) from FomoScan (ADMIN, audited)
      operationId: enrichWallet
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/WalletAddress'
      responses:
        '200':
          description: Enriched wallet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletResponse'
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/ErrorEnvelope' }
  /api/wallets/{address}:
    patch:
      summary: Update copy-trade config
      operationId: updateWalletCopy
      parameters:
        - $ref: '#/components/parameters/WalletAddress'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWalletDto'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/portfolio/transactions:
    get:
      summary: Paginated ledger (10/page default) from 30-day Postgres history
      operationId: getPortfolioTransactions
      parameters:
        - name: wallet
          in: query
          required: false
          schema:
            type: string
          description: Solana address or ALL (default ALL)
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 10
          description: 1-100
        - name: action
          in: query
          required: false
          schema:
            type: string
            enum: [BUY, SELL]
        - name: days
          in: query
          required: false
          schema:
            type: integer
            default: 30
          description: Day window 1-90
      responses:
        '200':
          description: Ledger page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioResponse'
  /api/portfolio/pnl:
    get:
      summary: Realized PnL estimate by FIFO buy-sell pairing (single wallet)
      operationId: getWalletPnl
      parameters:
        - name: wallet
          in: query
          required: true
          schema:
            type: string
          description: Solana address (ALL not supported)
        - name: days
          in: query
          required: false
          schema:
            type: integer
            default: 30
      responses:
        '200':
          description: PnL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletPnlResponse'
        '400':
          description: Missing wallet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/portfolio/pnl/overview:
    get:
      summary: Realized PnL overview for all tracked wallets
      operationId: getPnlOverview
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            default: 30
      responses:
        '200':
          description: Overview
          content:
            application/json:
              schema:
                type: object
                required: [success, total, asOf, data]
                properties:
                  success: { type: boolean }
                  total: { type: integer }
                  asOf: { type: string, format: date-time }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/WalletPnl' }
  /api/portfolio/holdings:
    get:
      summary: Live token holdings per wallet (SPL + Token-2022 + SOL), spot-priced
      operationId: getHoldings
      parameters:
        - name: wallet
          in: query
          required: true
          schema:
            type: string
          description: Tracked Solana address (ALL not supported)
      responses:
        '200':
          description: Holdings
          content:
            application/json:
              schema:
                type: object
                required: [success, asOf, data]
                properties:
                  success: { type: boolean }
                  asOf: { type: string, format: date-time }
                  data:
                    type: object
                    required: [wallet, asOf, solBalance, totalValueUsd, tokens]
                    properties:
                      wallet: { type: string }
                      asOf: { type: string, format: date-time }
                      solBalance: { type: number }
                      solPriceUsd: { type: number, nullable: true }
                      solValueUsd: { type: number, nullable: true }
                      totalValueUsd: { type: number }
                      tokens:
                        type: array
                        items:
                          type: object
                          required: [mint, symbol, balance]
                          properties:
                            mint: { type: string }
                            symbol: { type: string }
                            balance: { type: number }
                            priceUsd: { type: number, nullable: true }
                            valueUsd: { type: number, nullable: true }
  /api/portfolio/fomoscan:
    get:
      summary: Cross-check local FIFO realized vs FomoScan whole-wallet net (ADMIN)
      operationId: crossCheckFomoscan
      security: [{ bearerAuth: [] }]
      parameters:
        - name: wallet
          in: query
          required: true
          schema:
            type: string
          description: Tracked Solana address (ALL not supported)
        - name: days
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Local vs FomoScan comparison
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    required: [wallet, handle, localRealizedUsd, fomoscanWindow]
                    properties:
                      wallet: { type: string }
                      handle: { type: string, nullable: true }
                      localRealizedUsd: { type: number }
                      fomoscanNetUsd: { type: number, nullable: true }
                      fomoscanWindow: { type: string }
                      deltaUsd: { type: number, nullable: true }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
  /api/webhooks/helius:
    post:
      summary: Helius webhook receiver (push real-time for tracked wallets)
      operationId: receiveHeliusWebhook
      description: "Requires Authorization Bearer <HELIUS_WEBHOOK_SECRET> when the secret is set. Always ACKs fast; matched wallets run the standard ingest pipeline async."
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean }
  /api/onchain/stream:
    get:
      summary: Realtime SSE stream
      operationId: streamOnchain
      responses:
        '200':
          description: text/event-stream — CONNECTED then ONCHAIN_SWAP_EVENT, 15s heartbeat
          content:
            text/event-stream:
              schema:
                type: string
                example: "data: {\"type\":\"CONNECTED\",\"message\":\"SSE Stream Active - Listening to Solana on-chain swaps\",\"timestamp\":1790667900000}\n\ndata: {\"type\":\"ONCHAIN_SWAP_EVENT\",\"event\":{...}}\n\n"
  /api/onchain/events:
    get:
      summary: Persisted realtime event feed (DB, newest first)
      operationId: listRealtimeEvents
      parameters:
        - name: wallet
          in: query
          required: false
          schema:
            type: string
          description: Solana address filter (default ALL)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealtimeEventListResponse'
  /api/copy-trade/execute:
    post:
      summary: Execute copy-trade (sim default; paper on devnet with confirm)
      operationId: executeCopyTrade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteCopyDto'
      responses:
        '200':
          description: Copy record (simulated CONFIRMED or paper lifecycle)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CopyTradeResponse'
        '400':
          description: Invalid request (envelope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/copy-trade/history:
    get:
      summary: Copy order history (DB, newest first)
      operationId: listCopyHistory
      parameters:
        - name: wallet
          in: query
          required: false
          schema:
            type: string
          description: Master wallet filter (default ALL)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
          description: 1-100
      responses:
        '200':
          description: History
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CopyHistoryResponse'
  /api/vaults/mine:
    get:
      summary: My vault position (shares, value, returns, queues) for the session identity
      operationId: getMyVaultPosition
      security: [{ bearerAuth: [] }]
      parameters:
        - name: vaultId
          in: query
          required: false
          schema: { type: integer }
      responses:
        '200':
          description: Personal vault position
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    required: [vaultId, vaultName, sharePrice, shares, valueSol, depositedSol, withdrawnSol, returnsSol]
                    properties:
                      vaultId: { type: integer }
                      vaultName: { type: string }
                      sharePrice: { type: number }
                      shares: { type: number }
                      valueSol: { type: number }
                      depositedSol: { type: number }
                      withdrawnSol: { type: number }
                      returnsSol: { type: number }
                      queuedDeposits:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            amountSol: { type: number }
                            createdAt: { type: string, format: date-time }
                      queuedWithdrawals:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            shares: { type: number }
                            createdAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
  /api/vaults/deposit:
    post:
      summary: Queue a vault deposit (settled at epoch price)
      operationId: queueVaultDeposit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VaultDepositDto'
      responses:
        '200':
          description: Queued
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      id: { type: integer }
                      status: { type: string }
        '400':
          description: Invalid request (envelope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/vaults/withdraw:
    post:
      summary: Request a share withdrawal (settled at epoch price)
      operationId: requestVaultWithdraw
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VaultWithdrawDto'
      responses:
        '200':
          description: Queued
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      id: { type: integer }
                      status: { type: string }
        '400':
          description: Invalid request or insufficient shares (envelope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/vaults/settle:
    post:
      summary: Settle an epoch at given NAV (mints/burns, takes HWM fee)
      operationId: settleVaultEpoch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VaultSettleDto'
      responses:
        '200':
          description: Epoch settled
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/VaultSettleResult' }
        '400':
          description: Invalid request (envelope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/vaults/status:
    get:
      summary: Vault status + last epoch + queued counts
      operationId: getVaultStatus
      parameters:
        - name: vaultId
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/VaultStatus' }
  /api/auth/nonce:
    post:
      summary: Issue a login nonce for a wallet (fund-roles-auth)
      operationId: issueAuthNonce
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wallet]
              properties:
                wallet: { type: string, description: Base58 Solana address }
      responses:
        '200':
          description: Nonce + message to sign
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/AuthNonce' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
  /api/auth/verify:
    post:
      summary: Verify wallet signature, return bearer token
      operationId: verifyAuthSignature
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wallet, signature]
              properties:
                wallet: { type: string }
                signature: { type: string, description: Base58 ed25519 signature of nonce message }
      responses:
        '200':
          description: Session token
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/AuthSession' }
        '201':
          description: Session token (Nest POST default — live behavior)
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/AuthSession' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
  /api/auth/login:
    post:
      summary: Login with username/password (sets cookie, uniform 401)
      operationId: loginAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Session token
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/AuthSession' }
        '201':
          description: Session token (Nest POST default — live behavior)
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/AuthSession' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
  /api/auth/me:
    get:
      summary: Current session user (Bearer or cookie)
      operationId: getAuthMe
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
  /api/auth/logout:
    post:
      summary: Revoke current session (Bearer or cookie) + clear cookie
      operationId: logoutSession
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Revoked flag
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      revoked: { type: boolean }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
  /api/auth/purge:
    post:
      summary: Delete expired sessions + nonces (ADMIN only, audited, manual-only)
      operationId: purgeExpiredSessions
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Purged counts
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    required: [sessions, nonces]
                    properties:
                      sessions: { type: integer }
                      nonces: { type: integer }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
  /api/users:
    get:
      summary: List users (ADMIN only)
      operationId: listUsers
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: object
                required: [success, total, data]
                properties:
                  success: { type: boolean }
                  total: { type: integer }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
  /api/users/{wallet}/role:
    post:
      summary: Set user role (ADMIN only, audited)
      operationId: setUserRole
      security: [{ bearerAuth: [] }]
      parameters:
        - name: wallet
          in: path
          required: true
          schema: { type: string }
          description: Wallet address, cred:<username>, or bare credential username
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, reason]
              properties:
                role: { type: string, enum: [USER, KOL, ADMIN] }
                reason: { type: string }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ErrorEnvelope' }
        '401': { $ref: '#/components/responses/ErrorEnvelope' }
        '403': { $ref: '#/components/responses/ErrorEnvelope' }
  /api/audit:
    get:
      summary: List audit rows (ADMIN only, append-only store)
      operationId: listAudit
      security: [{ bearerAuth: [] }]
      parameters:
        - name: actor
          in: query
          required: false
          schema: { type: string }
        - name: action
          in: query
