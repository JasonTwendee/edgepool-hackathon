components:
  parameters:
    WalletAddress:
      name: address
      in: path
      required: true
      schema:
        type: string
      description: Base58 Solana address
  schemas:
    HealthResponse:
      type: object
      required: [status, service, rpcEndpoint, heliusEnabled, activeWalletsCount, timestamp]
      properties:
        status: { type: string, example: ONLINE }
        service: { type: string, example: FOMO-Wallet-Tracker-OnChain-Engine }
        rpcEndpoint: { type: string }
        heliusEnabled: { type: boolean }
        activeWalletsCount: { type: integer }
        timestamp: { type: string, format: date-time }
    TrackedWallet:
      type: object
      required: [address, label, handle, isCopyEnabled, allocationWeight, addedAt]
      properties:
        address: { type: string }
        label: { type: string }
        handle: { type: string }
        avatar: { type: string }
        bio: { type: string, nullable: true, description: Verified bio from FomoScan enrich }
        evmAddress: { type: string, nullable: true, description: Verified EVM wallet from FomoScan enrich }
        isActive: { type: boolean, description: Rotation state, false = dropped from top-N (history kept) }
        fomoPnlUsd: { type: number, nullable: true, description: Leaderboard snapshot PnL (instant display) }
        fomoRank: { type: integer, nullable: true, description: Leaderboard rank at last rotation tick }
        totalPnlUsd: { type: number }
        winRate: { type: number }
        isCopyEnabled: { type: boolean }
        allocationWeight: { type: number }
        addedAt: { type: string }
    WalletListResponse:
      type: object
      required: [success, total, data]
      properties:
        success: { type: boolean }
        total: { type: integer }
        data:
          type: array
          items: { $ref: '#/components/schemas/TrackedWallet' }
    WalletResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean }
        message: { type: string }
        data: { $ref: '#/components/schemas/TrackedWallet' }
    UpdateWalletDto:
      type: object
      properties:
        isCopyEnabled: { type: boolean }
        allocationWeight: { type: number }
    OnChainTransactionEvent:
      type: object
      required: [signature, slot, blockTime, formattedTime, wallet, source, action, symbol, dexVenue, slippageBps, status, feeSol]
      properties:
        signature: { type: string, description: 88-char Base58 }
        slot: { type: integer }
        blockTime: { type: integer }
        formattedTime: { type: string }
        wallet: { type: string }
        walletName: { type: string }
        source: { type: string, enum: [rpc, helius], description: 'rpc = real signature, heuristic fields; helius = parsed real data' }
        action: { type: string, enum: [BUY, SELL, TRANSFER, UNKNOWN] }
        symbol: { type: string }
        tokenMint: { type: string }
        amountToken: { type: number }
        amountUsd: { type: number }
        dexVenue: { type: string }
        slippageBps: { type: number }
        status: { type: string, enum: [SUCCESS, FAILED] }
        feeSol: { type: number }
        copySignal:
          type: object
          properties:
            canCopy: { type: boolean }
            recommendedVenue: { type: string }
            estimatedDelayMs: { type: number }
            targetSwapAmountUsd: { type: number }
    PortfolioResponse:
      type: object
      required: [success, total, walletsCount, page, pageSize, totalPages, asOf, data]
      properties:
        success: { type: boolean }
        total: { type: integer }
        walletsCount: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        totalPages: { type: integer }
        asOf: { type: string, format: date-time }
        data:
          type: array
          items: { $ref: '#/components/schemas/OnChainTransactionEvent' }
    RealtimeEvent:
      type: object
      required: [id, eventType, walletAddress, title, broadcastedAt]
      properties:
        id: { type: integer }
        eventType: { type: string, example: ONCHAIN_SWAP_EVENT }
        walletAddress: { type: string }
        txSignature: { type: string }
        title: { type: string }
        payload: { type: object }
        broadcastedAt: { type: string, format: date-time }
    RealtimeEventListResponse:
      type: object
      required: [success, total, data]
      properties:
        success: { type: boolean }
        total: { type: integer }
        data:
          type: array
          items: { $ref: '#/components/schemas/RealtimeEvent' }
    WalletPnlResponse:
      type: object
      required: [success, asOf, data]
      properties:
        success: { type: boolean }
        asOf: { type: string, format: date-time }
        data: { $ref: '#/components/schemas/WalletPnl' }
    WalletPnl:
      type: object
      required: [wallet, days, realizedPnlUsd, pairs, matchedSells, totalSells, totalBuys, perSymbol, series, topTrades]
      properties:
        wallet: { type: string }
        days: { type: integer }
        realizedPnlUsd: { type: integer }
        pairs: { type: integer }
        matchedSells: { type: integer }
        totalSells: { type: integer }
        totalBuys: { type: integer }
        winRate: { type: number }
        perSymbol:
          type: array
          items:
            type: object
            properties:
              symbol: { type: string }
              pairs: { type: integer }
              pnlUsd: { type: integer }
        series:
          type: array
          description: 'Cumulative realized curve (t = blockTime, cum = usd) for the chart'
          items:
            type: object
            properties:
              t: { type: integer }
              cum: { type: integer }
        topTrades:
          type: array
          description: 'Top-5 in-window swaps by USD (no extra ledger fetch needed)'
          items: { $ref: '#/components/schemas/OnChainTransactionEvent' }
    ExecuteCopyDto:
      type: object
      properties:
        masterTxHash: { type: string }
        symbol: { type: string }
        action: { type: string }
        amountUsd: { type: number }
        venue: { type: string }
        masterWallet: { type: string }
        masterHandle: { type: string }
        tokenMint:
          type: string
          description: Token mint for Qualify (RugCheck) + Manage pricing
        mode:
          type: string
          enum: [paper]
          description: Omit for legacy sim; 'paper' requires confirm=true (devnet only)
        confirm:
          type: boolean
          description: Explicit 1-click confirmation for paper execution
        maxSlippageBps: { type: integer }
        paperAmountSol:
          type: number
          description: Devnet dust proof amount in SOL (default 0.0001)
        entryMode:
          type: string
          enum: [immediate, scaled, patient]
          description: immediate fires 100% on qualify (default); others reserved
        tp1Pct:
          type: number
          description: TP1 target override in percent (default 60)
        stopPct:
          type: number
          description: Stop override in percent (default 30 interim, ATR later)
        tp1ShareBps:
          type: integer
          description: TP1 share 1-10000 bps (default 5000 = 50%)
        trailPct:
          type: integer
          description: Trailing pullback 1-100% from peak, post-TP1 (default 20)
        tp2MultPct:
          type: integer
          description: TP2 target 101-1000% of tp1 (default 200 = 2x)
        autoTune:
          type: boolean
          description: ATR regime auto-tune stop/TP/trail (default true; explicit params always win)
    CopyOrder:
      type: object
      required: [id, mode, status, createdAt]
      properties:
        id: { type: integer }
        masterWallet: { type: string }
        masterHandle: { type: string }
        masterTxHash: { type: string }
        symbol: { type: string }
        action: { type: string }
        amountUsd: { type: number }
        venue: { type: string }
        mode: { type: string, enum: [paper] }
        status: { type: string, enum: [PENDING, QUATED, SENT, CONFIRMED, FAILED] }
        devnetSignature: { type: string }
        entryMode: { type: string }
        delayDragPct: { type: number }
        tp1Pct: { type: number }
        stopPct: { type: number }
        tp1ShareBps: { type: integer }
        trailPct: { type: integer }
        tp2MultPct: { type: integer }
        error: { type: string }
        createdAt: { type: string, format: date-time }
    CopyHistoryResponse:
      type: object
      required: [success, total, data]
      properties:
        success: { type: boolean }
        total: { type: integer }
        data:
          type: array
          items: { $ref: '#/components/schemas/CopyOrder' }
    VaultDepositDto:
      type: object
      required: [depositor, amountSol]
      properties:
        vaultId: { type: integer }
        depositor: { type: string }
        amountSol: { type: number }
    VaultWithdrawDto:
      type: object
      required: [depositor, shares]
      properties:
        vaultId: { type: integer }
        depositor: { type: string }
        shares: { type: number }
    VaultSettleDto:
      type: object
      required: []
      properties:
        vaultId: { type: integer }
        navSol: { type: number, description: Omitted = NAV engine mark-to-market }
    VaultSettleResult:
      type: object
      properties:
        epochId: { type: integer }
        navSol: { type: number }
        sharePrice: { type: number }
        sharesOutstanding: { type: number }
        feeSol: { type: number }
    VaultStatus:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        feeBps: { type: integer }
        hwmSharePrice: { type: number }
        totalShares: { type: number }
        queuedDeposits: { type: integer }
        queuedWithdrawals: { type: integer }
    CopyTradeResponse:
      type: object
      required: [success, copyRecord]
      properties:
        success: { type: boolean }
        copyRecord:
          type: object
          properties:
            id: { type: string }
            masterHandle: { type: string }
            masterWallet: { type: string }
            masterTxHash: { type: string }
            vaultTxHash: { type: string }
            jitoBundleId: { type: string }
            slotNumber: { type: integer }
            symbol: { type: string }
            action: { type: string }
            tokenMint: { type: string }
            amountUsd: { type: number }
            executionVenue: { type: string }
            copyDelayMs: { type: integer }
            slippageBps: { type: integer }
            status: { type: string }
            timestamp: { type: string, format: date-time }
            devnetSignature:
              type: string
              description: Present for paper mode after broadcast (devnet only)
    SuccessMessage:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean }
        message: { type: string }
    ErrorResponse:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean }
        message: { type: string }
    User:
      type: object
      required: [id, wallet, role, createdAt]
      properties:
        id: { type: integer }
        wallet: { type: string, description: Base58 wallet OR cred:<username> for account login }
        username: { type: string, nullable: true, description: Credential username (null for wallet-only users) }
        email: { type: string, nullable: true }
        role: { type: string, enum: [USER, KOL, ADMIN] }
        createdAt: { type: string, format: date-time }
    AuthNonce:
      type: object
      required: [wallet, nonce, message, expiresAt]
      properties:
        wallet: { type: string }
        nonce: { type: string }
        message: { type: string, description: Exact message the wallet must sign }
        expiresAt: { type: string, format: date-time }
    AuthSession:
      type: object
      required: [token, user, expiresAt]
      properties:
        token: { type: string, description: Opaque bearer token (raw value shown once) }
        user: { $ref: '#/components/schemas/User' }
        expiresAt: { type: string, format: date-time }
    AuditLog:
      type: object
      required: [id, actor, action, createdAt]
      properties:
        id: { type: integer }
        actor: { type: string }
        action: { type: string }
        target: { type: string }
        reason: { type: string }
        metaJson: { type: object }
        createdAt: { type: string, format: date-time }
    VaultTrader:
      type: object
      required: [id, vaultId, wallet, weightBps, isActive, createdAt]
      properties:
        id: { type: integer }
        vaultId: { type: integer }
        wallet: { type: string }
        weightBps: { type: integer }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
    VaultWithTraders:
      type: object
      required: [id, name, environment, traders]
      properties:
        id: { type: integer }
        name: { type: string }
        environment: { type: string, enum: [SANDBOX, PRODUCTION] }
        traders:
          type: array
          items: { $ref: '#/components/schemas/VaultTrader' }
    VaultPolicy:
      type: object
      required: [id, policy]
      properties:
        id: { type: integer }
        policy:
          type: object
          required: [reserveBps, withdrawFeeBps, lockHours]
          properties:
            feeBps: { type: integer, description: Performance fee bps (report §4) }
            reserveBps: { type: integer }
            withdrawFeeBps: { type: integer }
            lockHours: { type: integer }
            settlePeriodHours: { type: integer, description: Settlement window period hours, 0 = always open }
            settleLengthMin: { type: integer, description: Window length minutes }
    PartnerPayout:
      type: object
      required: [id, trader, amountSol, status, createdAt]
      properties:
        id: { type: integer }
        trader: { type: string }
        amountSol: { type: number }
        epochId: { type: integer, nullable: true }
        kind: { type: string, enum: [PERF_FEE] }
        status: { type: string, enum: [ACCRUED] }
        createdAt: { type: string, format: date-time }
    VaultEarnings:
      type: object
      required: [vaultId, totalSol, byTrader, payouts]
      properties:
        vaultId: { type: integer }
        totalSol: { type: number, description: Total ACCRUED partner earnings (SOL) }
        byTrader: { type: object, additionalProperties: { type: number } }
        payouts:
          type: array
          items: { $ref: '#/components/schemas/PartnerPayout' }
    Bot:
      type: object
      required: [id, name, mode, status, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        mode: { type: string, enum: [AUTO, PAUSED] }
        vaultId: { type: integer }
        status: { type: string }
        createdAt: { type: string, format: date-time }
    AutoFireTickResult:
      type: object
      required: [scanned, fired, skippedNoScope, skippedDedupe, blocked, errors]
      properties:
        scanned: { type: integer }
        fired: { type: integer }
        skippedNoScope: { type: integer }
        skippedDedupe: { type: integer }
        blocked: { type: integer }
        errors: { type: integer }
        orderIds: { type: array, items: { type: integer } }
        note: { type: string }
        environment: { type: string, enum: [sandbox] }
    ManageTickResult:
      type: object
      required: [scanned, holds, tp1, tp2, stops, trails, timeStops, unknown, errors]
      properties:
        scanned: { type: integer }
        holds: { type: integer }
        tp1: { type: integer }
        tp2: { type: integer }
        stops: { type: integer }
        trails: { type: integer }
        timeStops: { type: integer }
        unknown: { type: integer }
        errors: { type: integer }
        closedIds: { type: array, items: { type: integer } }
        note: { type: string }
        environment: { type: string, enum: [sandbox] }
    AllocRebalanceResult:
      type: object
      properties:
        vaultId: { type: integer }
        vaults: { type: integer }
        updated: { type: integer }
        weights:
          type: array
          items:
            type: object
            properties:
              wallet: { type: string }
              weightBps: { type: integer }
        environment: { type: string, enum: [sandbox] }
    DemoSeed:
      type: object
      required: [vaultId, botId, traders, depositSol]
      properties:
        vaultId: { type: integer }
        botId: { type: integer }
        traders: { type: array, items: { type: string } }
        depositSol: { type: number }
        sharePrice: { type: number }
        environment: { type: string, enum: [sandbox] }
    DemoReplay:
      type: object
      properties:
        vaultId: { type: integer }
        botId: { type: integer }
        signals: { type: integer }
        fired: { type: integer }
        failed: { type: integer }
        orderIds: { type: array, items: { type: integer } }
        forceClosed: { type: integer }
        deposit2: { type: number }
        settleNavSol: { type: number }
        withdrawal:
          type: object
          properties:
            id: { type: integer }
            status: { type: string }
            pending: { type: boolean }
            message: { type: string }
        environment: { type: string, enum: [sandbox] }
    DemoReset:
      type: object
      properties:
        vaults: { type: integer }
        bots: { type: integer }
        orders: { type: integer }
        legs: { type: integer }
        deposits: { type: integer }
        withdrawals: { type: integer }
        epochs: { type: integer }
        traders: { type: integer }
        auditKept: { type: boolean }
        environment: { type: string, enum: [sandbox] }
    DemoPerformance:
      type: object
      properties:
        botId: { type: integer }
        botName: { type: string }
        orders: { type: integer }
        open: { type: integer }
        closed: { type: integer }
        wins: { type: integer }
        losses: { type: integer }
        winRate: { type: number }
        totalRealizedUsd: { type: number }
        equity:
          type: array
          items:
            type: object
            properties:
              t: { type: string, format: date-time }
              cum: { type: number }
        environment: { type: string, enum: [sandbox] }
  responses:
    ErrorEnvelope:
      description: Error envelope {success:false, message}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque session token from POST /api/auth/verify (also accepted via httpOnly fomo_session cookie, SameSite=Lax; production CSRF token is follow-up work — see fe-auth-plus tracker)
