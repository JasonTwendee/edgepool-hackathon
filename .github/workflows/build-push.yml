name: build-push

# Cloud build (GitHub-hosted, free): build BE+FE images -> push GHCR.
# Server (edgepool-dev / AWS mới) chỉ pull + run, KHÔNG build tại chỗ.
# Trigger sau khi CI xanh để chỉ đóng gói code đã verify.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-push-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # GHCR bắt buộc lowercase — hardcode để khỏi lệ thuộc case của repo owner.
  OWNER_LC: jasontwendee

jobs:
  images:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: fomo-family-&-fomoscan-research-hub
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build+push backend
        uses: docker/build-push-action@v5
        with:
          context: fomo-family-&-fomoscan-research-hub
          file: fomo-family-&-fomoscan-research-hub/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/jasontwendee/fomo-backend:main
            ghcr.io/jasontwendee/fomo-backend:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build+push frontend
        uses: docker/build-push-action@v5
        with:
          context: fomo-family-&-fomoscan-research-hub
          file: fomo-family-&-fomoscan-research-hub/frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/jasontwendee/fomo-frontend:main
            ghcr.io/jasontwendee/fomo-frontend:${{ github.event.workflow_run.head_sha || github.sha }}
          build-args: |
            BACKEND_URL=http://backend:3000
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Summary
        run: |
          echo "## GHCR images" >> "$GITHUB_STEP_SUMMARY"
          echo "- ghcr.io/jasontwendee/fomo-backend:main + :${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- ghcr.io/jasontwendee/fomo-frontend:main + :${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_STEP_SUMMARY"
