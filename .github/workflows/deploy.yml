name: deploy

# CD for main: runs ON the GCP box (edgepool-dev, 136.85.91.206) via a
# self-hosted runner (label edgepool-new; dials OUT, no inbound SSH needed).
# Triggered by build-push (which itself only runs after green CI), so GHCR
# images for this exact SHA are guaranteed to exist — server NEVER builds,
# only pulls (2GB box cannot afford local builds; measured load 27 + OOM).
# The runner checks out with an ephemeral token, then rsyncs into DEPLOY_DIR —
# the server itself needs NO GitHub credentials. Server .env files are NEVER
# touched by rsync (excluded) — sync-env.sh only appends missing keys.
# Old company box (edgepool-dev-old) kept as rollback standby, no auto-deploy.

on:
  workflow_run:
    workflows: [build-push]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  DEPLOY_DIR: /home/ubuntu/edgepool-hackathon
  PROJ_DIR: /home/ubuntu/edgepool-hackathon/fomo-family-&-fomoscan-research-hub

jobs:
  deploy:
    # Only auto-deploy green CI; manual runs always allowed.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, edgepool-new]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'main' }}
          path: repo

      - name: Sync code to deploy dir (keep server .env + data)
        run: |
          rsync -a --delete \
            --exclude backend/.env --exclude frontend/.env \
            --exclude node_modules --exclude .next \
            "$GITHUB_WORKSPACE/repo/" "$DEPLOY_DIR/"

      - name: Env auto-sync (append missing keys, never overwrite)
        working-directory: ${{ env.PROJ_DIR }}
        run: |
          bash scripts/sync-env.sh backend/.env.example backend/.env
          bash scripts/sync-env.sh frontend/.env.example frontend/.env

      - name: Pull + restart (prod + ghcr overlays, no local build)
        working-directory: ${{ env.PROJ_DIR }}
        run: |
          TAG="${{ github.event.workflow_run.head_sha || 'main' }}" docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.ghcr.yml pull backend frontend
          TAG="${{ github.event.workflow_run.head_sha || 'main' }}" docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.ghcr.yml up -d

      - name: Smoke (fail deploy on red)
        run: |
          for i in $(seq 1 18); do
            if curl -sf http://localhost:3000/api/health | head -c 60; then echo; break; fi
            echo "waiting backend... ($i/18)"; sleep 10
          done
          curl -sf http://localhost:3000/api/health | head -c 120; echo
          curl -sf -o /dev/null -w 'FE :3001 %{http_code}\n' http://localhost:3001/
          # Warm heavy endpoints so first public hit isn't a 20s cold plan
          curl -sf --max-time 120 http://localhost:3001/api/vaults/pools -o /dev/null -w 'pools warm %{http_code}\n'

      - name: Cleanup old images (keep recent for rollback, never volumes)
        working-directory: ${{ env.PROJ_DIR }}
        run: |
          KEEP=72h bash scripts/docker-cleanup.sh

      - name: Public demo URL via trycloudflare (opt-in, ephemeral)
        if: ${{ vars.TUNNEL_ENABLED == 'true' }}
        working-directory: ${{ env.PROJ_DIR }}
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.tunnel.yml up -d trycloudflare
          sleep 10
          URL=$(docker logs fomo-trycloudflare 2>&1 | grep -o 'https://[^ ]*trycloudflare.com' | head -n 1)
          echo "## Demo URL (doi moi lan restart): $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL"
